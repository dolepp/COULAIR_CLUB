[package]
name = "coulair-bot"
version = "0.1.0"
edition = "2021"
description = "Telegram-бот COULAIR CLUB: товары, характеристики, размерная сетка, поддержка"

[dependencies]
anyhow = "1"
html-escape = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
