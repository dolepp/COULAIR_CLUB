server {
    server_name coulair.ru www.coulair.ru 95.181.213.197;
    root /var/www/coulair/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|woff2?|mp4)$ {
        expires 1h;
        try_files $uri =404;
    }

    # coulair-api: СДЭК, ЮKassa, уведомления (systemd: coulair-api)
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }
    # предпросмотр новой версии сайта до переключения (next -> releases/...)
    location ^~ /preview/ {
        alias /var/www/coulair/next/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/coulair.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/coulair.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.coulair.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = coulair.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name coulair.ru www.coulair.ru 95.181.213.197;
    return 404; # managed by Certbot




}